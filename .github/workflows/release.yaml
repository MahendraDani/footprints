name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build archives
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            bin=footprints
            [ "$os" = "windows" ] && bin=footprints.exe

            stage="$(mktemp -d)"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/MahendraDani/footprints/cmd.version=${VERSION}" \
              -o "$stage/$bin" .

            name="footprints_${os}_${arch}"
            if [ "$os" = "windows" ]; then
              (cd "$stage" && zip -q "$GITHUB_WORKSPACE/dist/$name.zip" "$bin")
            else
              tar -czf "dist/$name.tar.gz" -C "$stage" "$bin"
            fi
          done

          (cd dist && sha256sum footprints_* > checksums.txt)
          ls -l dist

      - name: Smoke test the linux binary
        run: |
          set -euo pipefail
          tar -xzf dist/footprints_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          out="$("$RUNNER_TEMP/footprints" --version)"
          echo "$out"
          echo "$out" | grep -q "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes