<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>footprints · visit graph</title>
    <style>
      :root {
        --bg: #1e1e1e; --panel: #262626; --line: #363636;
        --fg: #dadada; --mut: #8a8a8a; --acc: #9488dd;
        --mono: "JetBrains Mono", "Fira Code", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%; margin: 0; background: var(--bg); color: var(--fg);
        font: 12px/1.5 var(--mono); overflow: hidden;
      }
      body { display: flex; flex-direction: column; }
      header {
        display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center;
        padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 20;
      }
      .brand { font-weight: 700; color: var(--fg); }
      .brand span { color: var(--mut); font-weight: 400; }
      input[type="search"] {
        width: 230px; padding: 5px 10px; font: inherit; color: var(--fg);
        background: var(--bg); border: 1px solid var(--line); border-radius: 6px; outline: none;
      }
      input[type="search"]:focus { border-color: var(--acc); }
      label { display: flex; gap: 6px; align-items: center; color: var(--mut); cursor: pointer; user-select: none; }
      input[type="checkbox"] { accent-color: var(--acc); cursor: pointer; }
      kbd { font: inherit; font-size: 10px; padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; color: var(--mut); }
      #stats { margin-left: auto; color: var(--mut); }

      main { flex: 1; min-height: 0; position: relative; overflow: hidden; background: var(--bg); }
      canvas { display: block; width: 100%; height: 100%; }

      #tip {
        position: absolute; display: none; width: 320px; padding: 12px 14px; z-index: 30;
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      #tip .t {
        font-size: 13px; font-weight: 600; padding-right: 18px; word-break: break-word;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      }
      #tip .u {
        margin: 4px 0 10px; font-size: 11px; color: var(--acc);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #tip .footer {
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        padding-top: 8px; border-top: 1px solid var(--line); font-size: 11px; color: var(--mut);
      }
      #tip .footer span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #tip a {
        padding: 2px 10px; border: 1px solid var(--line); border-radius: 6px;
        color: var(--fg); text-decoration: none; white-space: nowrap;
      }
      #tip a:hover { border-color: var(--acc); color: var(--acc); }
      #tip .x {
        position: absolute; top: 6px; right: 8px; padding: 0 4px; background: none; border: 0;
        color: var(--mut); cursor: pointer; font: inherit; font-size: 16px; line-height: 1;
      }
      #tip .x:hover { color: var(--fg); }

      #warn {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: none; z-index: 25;
        max-width: min(640px, calc(100% - 32px)); padding: 8px 12px;
        background: #2b1f1f; border: 1px solid #5c3a3a; color: #d9a3a3; border-radius: 6px;
      }
      #legend {
        position: absolute; left: 16px; bottom: 16px; z-index: 10; max-width: min(560px, calc(100% - 32px));
        display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 6px 8px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--mut);
      }
      #legend .note { padding: 0 6px; }
      .chip {
        display: flex; align-items: center; gap: 6px; padding: 2px 8px; font: inherit; color: var(--mut);
        background: none; border: 1px solid transparent; border-radius: 6px; cursor: pointer;
      }
      .chip:hover { border-color: var(--line); color: var(--fg); }
      .chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
      .chip.off { opacity: 0.45; text-decoration: line-through; }
      .chip.off i { background: transparent !important; box-shadow: inset 0 0 0 1px var(--mut); }
      .chip.all { color: var(--acc); }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">footprints <span>~/graph</span></div>
      <input id="q" type="search" placeholder="filter url or title  ( / )" />
      <label><input id="dir" type="checkbox" /> directed <kbd>d</kbd></label>
      <label><input id="labels" type="checkbox" checked /> labels <kbd>l</kbd></label>
      <label><input id="single" type="checkbox" /> unlinked <kbd>u</kbd></label>
      <span id="stats"></span>
    </header>
    <main id="main">
      <canvas id="c"></canvas>
      <div id="tip"></div>
      <div id="warn"></div>
      <div id="legend"></div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const warn = (m) => { const w = $("warn"); w.textContent = m; w.style.display = "block"; };

      try {
        const CFG = __CONFIG__;
        const RAW = __DATA__;
        const rows = (Array.isArray(RAW) ? RAW : []).filter((r) => r && r.id != null);
        if (!rows.length) warn("No visits to show.");

        const TR = { 0: "Link", 1: "Typed", 2: "Bookmark", 3: "Subframe", 4: "Manual subframe", 5: "Generated",
                     6: "Auto top-level", 7: "Form submit", 8: "Reload", 9: "Keyword", 10: "Keyword generated" };
        const COL = { 0: "#7f8fb8", 1: "#b98aa8", 2: "#c4a46a", 3: "#6b6b6b", 4: "#858585", 5: "#9a86c7",
                      6: "#c28c68", 7: "#8fae7a", 8: "#b8706e", 9: "#6fa8a0", 10: "#b583b0" };
        const ACC = "#9488dd", BG = "#1e1e1e", FG = "#dadada";
        const MONO = getComputedStyle(document.documentElement).getPropertyValue("--mono").trim();
        const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

        // ---- Labels: host by default, host + first path segment for highlighted nodes ----
        const clip = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);
        function labels(u) {
          try {
            const x = new URL(u);
            if (!/^https?:$/.test(x.protocol)) {
              const l = clip(x.protocol + "//" + (x.host || x.pathname.split("/").filter(Boolean).pop() || ""), 28);
              return [l, l];
            }
            const host = x.host.replace(/^www\./, "");
            const seg = x.pathname.split("/")[1];
            return [clip(host, 28), clip(seg ? host + "/" + seg : host, 34)];
          } catch { const l = clip(String(u || ""), 24); return [l, l]; }
        }
        const fmtDur = (s) => {
          if (!s || s < 1) return "< 1s";
          if (s < 60) return s.toFixed(1) + "s";
          const m = Math.floor(s / 60);
          return m < 60 ? `${m}m ${Math.round(s % 60)}s` : `${Math.floor(m / 60)}h ${m % 60}m`;
        };
        const openable = (u) => /^https?:\/\//i.test(u);

        // ---- Graph data ----
        const byId = new Map(rows.map((r) => [r.id, {
          id: r.id, from: r.from_visit || 0, url: r.url || "", title: r.title || "",
          tr: r.core_transition ?? 0, sec: +r.seconds_on_page || 0, at: r.visited_at || "", deg: 0,
        }]));
        const links = [], par = new Map(), kids = new Map(), adj = new Map();
        const addAdj = (a, b) => { if (!adj.has(a)) adj.set(a, new Set()); adj.get(a).add(b); };
        byId.forEach((n) => {
          const p = byId.get(n.from);
          if (p && p !== n) {
            links.push({ s: p.id, t: n.id }); p.deg++; n.deg++;
            par.set(n.id, p.id);
            if (!kids.has(p.id)) kids.set(p.id, []);
            kids.get(p.id).push(n.id);
            addAdj(p.id, n.id); addAdj(n.id, p.id);
          }
        });
        const nodes = [...byId.values()];
        nodes.forEach((n) => {
          n.r = 4 + Math.min(10, Math.sqrt(n.sec / 10)); // size = time on page
          [n.l1, n.l2] = labels(n.url);
          n.p = n.deg * 1000 + n.sec; // label priority: hubs and long visits win
        });

        // ---- Modes and filters ----
        let dirOn = !!CFG.directed;
        $("dir").checked = dirOn;
        const allTypes = [...new Set(nodes.map((n) => n.tr))].sort((a, b) => a - b);
        const typeOn = new Set(allTypes);
        const vis = (n) => typeOn.has(n.tr);

        // ---- Canvas + zoom ----
        const canvas = $("c"), ctx = canvas.getContext("2d"), main = $("main");
        let W = 0, H = 0, dpr = 1, T = d3.zoomIdentity, dirty = true, anim = false, userMoved = false;
        function resize() {
          dpr = window.devicePixelRatio || 1;
          W = main.clientWidth; H = main.clientHeight;
          canvas.width = W * dpr; canvas.height = H * dpr;
          dirty = true;
        }
        const zoom = d3.zoom().scaleExtent([0.05, 8]).on("zoom", (e) => {
          T = e.transform; dirty = true;
          if (e.sourceEvent) userMoved = true;
        });

        // ---- State ----
        let sim, simNodes = [], simIds = new Set(), L = [], byPrio = [], hidden = 0;
        let sel = null, hoveredId = null, activeId = null, S = null, SL = null, M = null;
        const on = (n) => vis(n) && (!M || M.has(n.id)) && (!S || S.has(n.id));
        const ok = (id) => simIds.has(id) && vis(byId.get(id));

        // Undirected: everything connected, however far. Directed: the path that led here + everything it led to.
        function reach(id) {
          const s = new Set([id]), st = [id];
          if (!dirOn) {
            while (st.length) for (const m of adj.get(st.pop()) || []) if (!s.has(m) && ok(m)) { s.add(m); st.push(m); }
          } else {
            let p = par.get(id);
            while (p != null && !s.has(p) && ok(p)) { s.add(p); p = par.get(p); }
            while (st.length) for (const k of kids.get(st.pop()) || []) if (!s.has(k) && ok(k)) { s.add(k); st.push(k); }
          }
          return s;
        }
        function recompute() {
          const q = $("q").value.trim().toLowerCase();
          activeId = hoveredId ?? sel;
          S = activeId == null ? null : reach(activeId);
          SL = S && [...S].map((id) => byId.get(id))
            .sort((a, b) => (b.id === activeId) - (a.id === activeId) || b.p - a.p);
          M = q ? new Set(simNodes.filter((n) => (n.url + " " + n.title).toLowerCase().includes(q)).map((n) => n.id)) : null;
          dirty = true;
        }
        function updateStats() {
          const vn = simNodes.filter(vis).length, vl = L.filter((l) => vis(l.source) && vis(l.target)).length;
          $("stats").textContent = `${vn.toLocaleString()} visits · ${vl.toLocaleString()} links` +
            (hidden ? ` · ${hidden.toLocaleString()} unlinked hidden` : "");
        }

        // ---- Legend: clickable transition-type filters ----
        const chips = new Map();
        function refreshChips() { chips.forEach((b, t) => b.classList.toggle("off", !typeOn.has(t))); }
        function typesChanged() {
          refreshChips();
          if (hoveredId != null && !ok(hoveredId)) hoveredId = null;
          if (sel != null && !ok(sel)) sel = null;
          recompute(); syncCard(); updateStats();
        }
        function renderLegend() {
          const cnt = d3.rollup(simNodes, (v) => v.length, (n) => n.tr);
          const el = $("legend"); el.replaceChildren(); chips.clear();
          for (const t of [...cnt.keys()].sort((a, b) => a - b)) {
            const b = document.createElement("button"); b.className = "chip";
            b.title = "click: show/hide · double-click: show only this";
            const i = document.createElement("i"); i.style.background = COL[t] || "#858585";
            b.append(i, `${TR[t] ?? t} ${cnt.get(t).toLocaleString()}`);
            b.onclick = () => { typeOn.has(t) ? typeOn.delete(t) : typeOn.add(t); typesChanged(); };
            b.ondblclick = () => { typeOn.clear(); typeOn.add(t); typesChanged(); };
            chips.set(t, b); el.append(b);
          }
          const all = document.createElement("button"); all.className = "chip all"; all.textContent = "all";
          all.onclick = () => { allTypes.forEach((t) => typeOn.add(t)); typesChanged(); };
          const note = document.createElement("span"); note.className = "note"; note.textContent = "size = time on page";
          el.append(all, note); refreshChips();
        }

        // ---- Layout: warm up before the first paint, then relax live ----
        function fit() {
          if (!simNodes.length) return;
          const xs = simNodes.map((n) => n.x).sort(d3.ascending), ys = simNodes.map((n) => n.y).sort(d3.ascending);
          const x0 = d3.quantile(xs, 0.02), x1 = d3.quantile(xs, 0.98);
          const y0 = d3.quantile(ys, 0.02), y1 = d3.quantile(ys, 0.98), pad = 70;
          const k = Math.max(0.05, Math.min(2, (W - 2 * pad) / Math.max(1, x1 - x0), (H - 2 * pad) / Math.max(1, y1 - y0)));
          d3.select(canvas).call(zoom.transform,
            d3.zoomIdentity.translate(W / 2 - (k * (x0 + x1)) / 2, H / 2 - (k * (y0 + y1)) / 2).scale(k));
        }
        function build() {
          if (sim) sim.stop();
          const showAll = $("single").checked;
          simNodes = nodes.filter((n) => showAll || n.deg > 0);
          simIds = new Set(simNodes.map((n) => n.id));
          hidden = nodes.length - simNodes.length;
          byPrio = [...simNodes].sort((a, b) => b.p - a.p);
          if (sel != null && !simIds.has(sel)) sel = null;
          hoveredId = null;
          L = links.map((l) => ({ source: l.s, target: l.t }));

          sim = d3.forceSimulation(simNodes).alphaDecay(0.04).velocityDecay(0.4)
            .force("link", d3.forceLink(L).id((d) => d.id).distance(60).strength(0.7))
            .force("charge", d3.forceManyBody().strength(-130).distanceMax(500))
            .force("x", d3.forceX(0).strength(0.012)).force("y", d3.forceY(0).strength(0.012))
            .force("collide", d3.forceCollide((d) => d.r + 3))
            .stop();
          for (let i = 0; i < 80; i++) sim.tick();
          fit();
          sim.on("tick", () => { dirty = true; })
             .on("end", () => { if (!userMoved) fit(); })
             .alpha(0.5).restart();

          renderLegend(); updateStats();
          recompute(); syncCard();
        }

        // ---- Drawing ----
        const TAU = Math.PI * 2;
        function arrow(path, l, size, k) { // triangle at the target's edge, pointing along source -> target
          const dx = l.target.x - l.source.x, dy = l.target.y - l.source.y, len = Math.hypot(dx, dy);
          const gap = l.target.r + 1.5 / k;
          if (len < gap + size * 1.6) return;
          const ux = dx / len, uy = dy / len, bx = l.target.x - ux * gap, by = l.target.y - uy * gap, w = size * 0.45;
          path.moveTo(bx, by);
          path.lineTo(bx - ux * size + uy * w, by - uy * size - ux * w);
          path.lineTo(bx - ux * size - uy * w, by - uy * size + ux * w);
          path.closePath();
        }
        function draw(t) {
          const k = T.k, size = Math.min(7 / k, 14);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, W, H);
          ctx.save();
          ctx.translate(T.x, T.y); ctx.scale(k, k);

          const cold = new Path2D(), coldH = new Path2D(), hot = new Path2D(), hotH = new Path2D();
          let nHot = 0;
          for (const l of L) {
            const a = l.source, b = l.target;
            if (!vis(a) || !vis(b)) continue;
            const isHot = S && S.has(a.id) && S.has(b.id);
            const p = isHot ? hot : cold;
            p.moveTo(a.x, a.y); p.lineTo(b.x, b.y);
            if (isHot) nHot++;
            if (dirOn) arrow(isHot ? hotH : coldH, l, size, k);
          }
          ctx.lineWidth = 1 / k; ctx.strokeStyle = "#555"; ctx.fillStyle = "#666";
          ctx.globalAlpha = S ? 0.05 : M ? 0.12 : 0.5;
          ctx.stroke(cold);
          if (dirOn) ctx.fill(coldH);

          anim = dirOn && nHot > 0 && nHot < 600 && !calm; // flowing dashes only make sense when direction matters
          if (nHot) {
            ctx.globalAlpha = 0.9; ctx.strokeStyle = ACC; ctx.fillStyle = ACC; ctx.lineWidth = 1.8 / k;
            ctx.setLineDash([7 / k, 5 / k]);
            ctx.lineDashOffset = anim ? (-(t || 0) * 0.03) / k : 0;
            ctx.stroke(hot);
            ctx.setLineDash([]);
            if (dirOn) ctx.fill(hotH);
          }

          for (const pass of [false, true]) { // dimmed nodes first, lit nodes on top
            for (const n of simNodes) {
              if (!vis(n)) continue;
              const o = on(n);
              if (o !== pass) continue;
              ctx.globalAlpha = o ? 1 : 0.12;
              ctx.fillStyle = COL[n.tr] || "#858585";
              ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, TAU); ctx.fill();
            }
          }
          ctx.globalAlpha = 1;
          for (const [id, color] of [[sel, FG], [hoveredId, ACC]]) { // selected = light ring, hovered = accent ring
            const n = id != null && byId.get(id);
            if (!n || n.x === undefined || !simIds.has(id) || !vis(n)) continue;
            ctx.lineWidth = 2 / k; ctx.strokeStyle = color;
            ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 2 / k, 0, TAU); ctx.stroke();
          }
          ctx.restore();

          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          if ($("labels").checked && k > 0.12) drawLabels();
          placeCard();
        }

        function drawLabels() {
          ctx.font = "11px " + MONO; ctx.textAlign = "center"; ctx.textBaseline = "top";
          ctx.lineJoin = "round"; ctx.lineWidth = 3; ctx.strokeStyle = BG;
          const detail = !!(S || M), key = detail ? "w2" : "w1", boxes = [];
          let tries = 0;
          for (const n of SL || byPrio) {
            if (!on(n)) continue;
            const x = T.applyX(n.x), y = T.applyY(n.y) + Math.max(2, n.r * T.k) + 3;
            if (x < -80 || x > W + 80 || y < -20 || y > H + 20) continue;
            if (++tries > 1500 || boxes.length > 260) break;
            const txt = detail ? n.l2 : n.l1;
            if (n[key] === undefined) n[key] = ctx.measureText(txt).width;
            const x0 = x - n[key] / 2 - 4, x1 = x0 + n[key] + 8, y1 = y + 15;
            let hit = false;
            for (const b of boxes) if (x0 < b[2] && x1 > b[0] && y < b[3] && y1 > b[1]) { hit = true; break; }
            if (hit) continue;
            boxes.push([x0, y, x1, y1]);
            ctx.fillStyle = n.id === activeId ? FG : "#9a9a9a";
            ctx.strokeText(txt, x, y); ctx.fillText(txt, x, y);
          }
        }
        function frame(t) {
          if (dirty || anim) { dirty = false; draw(t); }
          requestAnimationFrame(frame);
        }

        // ---- Details card (opens on click, follows its node) ----
        const tip = $("tip");
        let cardFor = null, cw = 320, ch = 0;
        function syncCard() {
          if (sel == null || !ok(sel)) { tip.style.display = "none"; cardFor = null; return; }
          if (cardFor === sel) return;
          const n = byId.get(sel);
          tip.replaceChildren();
          const x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.title = "close (Esc)";
          x.onclick = () => { sel = null; recompute(); syncCard(); };
          const title = document.createElement("div"); title.className = "t"; title.textContent = n.title || "(no title)";
          const url = document.createElement("div"); url.className = "u"; url.textContent = n.url; url.title = n.url;
          const meta = document.createElement("span");
          meta.textContent = [TR[n.tr] ?? n.tr, "⏱ " + fmtDur(n.sec), n.at].filter(Boolean).join(" • ");
          const footer = document.createElement("div"); footer.className = "footer"; footer.append(meta);
          if (openable(n.url)) {
            const a = document.createElement("a");
            a.href = n.url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = "open ↗";
            footer.append(a);
          }
          tip.append(x, title, url, footer);
          tip.style.display = "block";
          cardFor = sel; ch = tip.offsetHeight; dirty = true;
        }
        function placeCard() {
          if (cardFor == null) return;
          const n = byId.get(cardFor);
          if (!n || n.x === undefined) return;
          const sx = T.applyX(n.x), sy = T.applyY(n.y), off = n.r * T.k + 12;
          let x = sx + off; if (x + cw > W - 8) x = sx - off - cw;
          tip.style.left = Math.max(8, x) + "px";
          tip.style.top = Math.max(8, Math.min(sy - ch / 2, H - ch - 8)) + "px";
        }

        // ---- Interaction ----
        let dragging = false;
        function findNode(x, y) { // nearest visible node under the point
          let best = null, bd = Infinity;
          for (const n of simNodes) {
            if (!vis(n)) continue;
            const d = Math.hypot(n.x - x, n.y - y);
            if (d <= n.r + 8 / T.k && d < bd) { bd = d; best = n; }
          }
          return best;
        }
        const nodeAt = (e) => {
          const r = canvas.getBoundingClientRect(), p = T.invert([e.clientX - r.left, e.clientY - r.top]);
          return findNode(p[0], p[1]);
        };
        canvas.addEventListener("mousemove", (e) => {
          if (dragging) return;
          const n = nodeAt(e), id = n ? n.id : null;
          canvas.style.cursor = n ? "pointer" : "default"; // pointer only over nodes
          if (id !== hoveredId) { hoveredId = id; recompute(); }
        });
        canvas.addEventListener("mouseleave", () => { if (hoveredId != null) { hoveredId = null; recompute(); } });
        canvas.addEventListener("click", (e) => {
          const n = nodeAt(e);
          sel = n ? (sel === n.id ? null : n.id) : null;
          recompute(); syncCard();
        });

        d3.select(canvas) // drag is registered before zoom, so grabbing a node doesn't pan
          .call(d3.drag().container(canvas)
            .subject((e) => { const p = T.invert([e.x, e.y]); return findNode(p[0], p[1]); })
            .on("start", (e) => {
              dragging = true;
              if (!e.active) sim.alphaTarget(0.3).restart();
              e.subject.fx = e.subject.x; e.subject.fy = e.subject.y;
            })
            .on("drag", (e) => { const p = T.invert([e.x, e.y]); e.subject.fx = p[0]; e.subject.fy = p[1]; })
            .on("end", (e) => { dragging = false; if (!e.active) sim.alphaTarget(0); e.subject.fx = e.subject.fy = null; }))
          .call(zoom)
          .on("dblclick.zoom", null);

        $("q").oninput = recompute;
        $("labels").onchange = () => { dirty = true; };
        $("dir").onchange = () => { dirOn = $("dir").checked; recompute(); };
        $("single").onchange = () => { userMoved = false; build(); };
        addEventListener("resize", resize);
        addEventListener("keydown", (e) => {
          if (e.key === "Escape") { sel = null; $("q").value = ""; $("q").blur(); recompute(); syncCard(); return; }
          if (e.target === $("q") || e.metaKey || e.ctrlKey || e.altKey) return;
          if (e.key === "/") { e.preventDefault(); $("q").focus(); }
          else if (e.key === "l") $("labels").click();
          else if (e.key === "u") $("single").click();
          else if (e.key === "d") $("dir").click();
        });

        resize();
        build();
        requestAnimationFrame(frame); // start drawing only after all state is initialized
      } catch (err) {
        console.error(err);
        warn("Graph failed to render: " + err.message);
      }
    </script>
  </body>
</html>
